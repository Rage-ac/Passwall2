name: Update PassWall2 Packages

on:
  schedule:
    # Check for new releases every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get upstream latest release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_JSON=$(gh api repos/Openwrt-Passwall/openwrt-passwall2/releases/latest)
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream latest release: $TAG"

      - name: Get our latest release
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || echo "none")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Current release: $TAG"

      - name: Check if update needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Fetch upstream and current release metadata. The decision itself lives in
          # scripts/check-update.sh so it can be unit tested (see tests/test-check-update.sh).
          gh api repos/Openwrt-Passwall/openwrt-passwall2/releases/latest > upstream-release.json
          gh api repos/${{ github.repository }}/releases/latest > current-release.json 2>/dev/null \
            || echo '{}' > current-release.json

          # The manifest of the currently published site tells which architectures were really
          # built from the current tag, as opposed to carried over from an earlier release.
          curl -fsSL --retry 3 -o published-manifest.json \
            "https://rage-ac.github.io/Passwall2/packages/manifest.json" \
            || echo "No published manifest (first deployment or older site)"

          bash ./scripts/check-update.sh \
            --upstream upstream-release.json \
            --current current-release.json \
            --manifest published-manifest.json >> "$GITHUB_OUTPUT"

      - name: Download upstream release assets
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p downloads
          gh api repos/Openwrt-Passwall/openwrt-passwall2/releases/latest             | jq -r '.assets[] | select(.name | test("apk|.apk$")) | .browser_download_url'             > asset-urls.txt

          # Retry: a single 500 from GitHub used to abort the whole build and leave the mirror
          # a release behind until the next cron tick. Reading from a file (not a pipe) keeps
          # set -e effective, so an asset that stays unavailable fails the run instead of
          # silently producing an incomplete build.
          while read -r url; do
            [ -n "$url" ] || continue
            name=$(basename "$url")
            echo "Downloading: $name"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 600               -o "downloads/$name" "$url"
          done < asset-urls.txt

          ls -lh downloads/

      - name: Extract and organize packages
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p packages
          : > fresh-arches.txt

          # Extract architecture-specific ZIP archives
          for zip in downloads/passwall_packages_apk_*.zip; do
            [ -f "$zip" ] || continue
            ARCH=$(basename "$zip" .zip | sed 's/passwall_packages_apk_//')
            echo "Extracting packages for arch: $ARCH"
            mkdir -p "packages/$ARCH"
            unzip -o "$zip" -d "packages/$ARCH/"
            echo "$ARCH" >> fresh-arches.txt
          done

          # Carry over architectures upstream has not published for this build from our previous
          # release. The Pages deployment replaces the whole site, so an architecture missing from
          # this build would otherwise disappear from the repository until upstream catches up
          # (issue #5). Carried-over architectures stay in the release assets as well, so the next
          # run always has a source to carry them over from; manifest.json records which of them
          # were actually built from the current tag.
          PREV_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          : > prev-assets.txt
          if [ -n "$PREV_TAG" ]; then
            gh release view "$PREV_TAG" --repo "${{ github.repository }}" --json assets \
              --jq '.assets[].name' > prev-assets.txt 2>/dev/null || : > prev-assets.txt
          fi

          # Which architectures to carry over, and which ones the deployment must end up with
          # (see tests/test-plan-carryover.sh).
          bash ./scripts/plan-carryover.sh \
            --fresh fresh-arches.txt \
            --previous prev-assets.txt \
            --expected-out expected-arches.txt > carryover-plan.txt

          while read -r arch asset; do
            [ -n "$arch" ] || continue
            echo "Carrying over arch $arch from previous release $PREV_TAG"
            if gh release download "$PREV_TAG" --repo "${{ github.repository }}" \
                 --pattern "$asset" --dir carryover --clobber; then
              mkdir -p "packages/$arch"
              unzip -o "carryover/$asset" -d "packages/$arch/"
            else
              echo "WARNING: could not download $asset; $arch will be missing from this deployment"
            fi
          done < carryover-plan.txt
          rm -rf carryover prev-assets.txt

          echo "=== Expected architectures ==="
          tr '\n' ' ' < expected-arches.txt; echo

          # noarch directory: standalone APK files (luci-app, luci-i18n)
          mkdir -p packages/noarch
          for apk in downloads/*.apk; do
            [ -f "$apk" ] || continue
            cp "$apk" "packages/noarch/"
          done

          # Copy standalone APKs into each arch directory
          # Copy arch-specific packages into noarch (deps may resolve there)
          for dir in packages/*/; do
            [ "$(basename "$dir")" = "noarch" ] && continue
            for apk in downloads/*.apk; do
              [ -f "$apk" ] || continue
              cp "$apk" "$dir"
            done
            for apk in "$dir"*.apk; do
              [ -f "$apk" ] || continue
              cp -n "$apk" "packages/noarch/" 2>/dev/null
            done
          done

          echo "=== Package counts per arch ==="
          for dir in packages/*/; do
            echo "$(basename "$dir"): $(find "$dir" -name '*.apk' | wc -l) packages"
          done

      - name: Build apk-tools v3
        if: steps.check.outputs.update == 'true'
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build libssl-dev zlib1g-dev lua5.3 liblua5.3-dev scdoc cmake git

          # Clone from the GitHub mirror first: gitlab.alpinelinux.org sits behind an anti-bot
          # gateway that answers 418 to CI runners, which broke every build from 2026-09-02
          # until this changed. GitLab stays as the fallback in case the mirror lags behind.
          APK_TAG=v3.0.5
          for remote in https://github.com/alpinelinux/apk-tools.git \
                        https://gitlab.alpinelinux.org/alpine/apk-tools.git; do
            echo "Cloning apk-tools $APK_TAG from $remote"
            if git clone --depth 1 --branch "$APK_TAG" "$remote" /tmp/apk-tools; then
              break
            fi
            rm -rf /tmp/apk-tools
          done
          [ -d /tmp/apk-tools ] || { echo "ERROR: could not clone apk-tools $APK_TAG"; exit 1; }

          cd /tmp/apk-tools
          meson setup build -Dprefix=/usr/local -Dlua=disabled -Ddocs=disabled
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
          echo "apk-tools built:"
          apk --version

      - name: Sign packages and generate APKINDEX
        if: steps.check.outputs.update == 'true'
        run: |
          echo "${{ secrets.APK_SIGNING_KEY }}" > /tmp/passwall2-repo.rsa
          chmod 600 /tmp/passwall2-repo.rsa

          for dir in packages/*/; do
            arch=$(basename "$dir")
            echo "=== Processing: $arch ==="
            cd "$dir"

            echo "  Generating APKINDEX..."
            /usr/local/bin/apk mkndx \
              --allow-untrusted \
              --output APKINDEX.tar.gz \
              --sign /tmp/passwall2-repo.rsa \
              --description "PassWall2 packages for $arch" \
              *.apk 2>&1

            ls -la APKINDEX.tar.gz
            echo "  Done: $arch"
            cd "$GITHUB_WORKSPACE"
          done

          rm -f /tmp/passwall2-repo.rsa

          echo "=== Verification ==="
          find packages -name "APKINDEX.tar.gz" -exec ls -la {} \;

      - name: Prepare Pages artifact
        if: steps.check.outputs.update == 'true'
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"

          INDEX_COUNT=$(find packages -name "APKINDEX.tar.gz" | wc -l)
          echo "Found $INDEX_COUNT APKINDEX.tar.gz files"
          if [ "$INDEX_COUNT" -eq 0 ]; then
            echo "ERROR: No APKINDEX.tar.gz files found!"
            exit 1
          fi

          mkdir -p _site/packages
          cp -r packages/* _site/packages/

          # Manifest of what this deployment serves. "fresh" are the architectures built from this
          # upstream tag, "arches" is everything published (including carried-over architectures).
          # The next run reads it back over HTTP to tell the two apart.
          find _site/packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort > site-arches.txt
          jq -n --arg tag "$TAG" \
                --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --rawfile fresh fresh-arches.txt \
                --rawfile arches site-arches.txt \
            '{tag: $tag, generated: $generated,
              fresh: ($fresh | split("\n") | map(select(length > 0)) | sort),
              arches: ($arches | split("\n") | map(select(length > 0)))}' \
            > _site/packages/manifest.json
          cat _site/packages/manifest.json

          # Copy public key
          mkdir -p _site/keys
          cp keys/passwall2-repo.rsa.pub _site/keys/

          echo "=== Site structure ==="
          du -sh _site/
          find _site -name "APKINDEX.tar.gz" | wc -l
          ls _site/packages/

      - name: Verify repository before deploying
        if: steps.check.outputs.update == 'true'
        run: |
          # Refuse to replace the published repository with an incomplete one: every architecture
          # that is expected must exist, and every published index must be a non-truncated ADB
          # index. Deploying a tree without an architecture makes apk answer "HTTP 404: Not Found"
          # for those users (issue #3); a truncated index gives "unexpected end of file" (issue #5).
          bash ./scripts/verify-repo.sh --dir _site/packages --expect "@expected-arches.txt" --min-arch 10

      - name: Upload Pages artifact
        if: steps.check.outputs.update == 'true'
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.update == 'true'
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Create GitHub release
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"

          ASSETS=()

          # Per-arch signed ZIP archives — everything the site publishes, including architectures
          # carried over from the previous release, so the next run can carry them over again.
          for dir in packages/*/; do
            arch=$(basename "$dir")
            zipname="passwall2_signed_apk_${arch}.zip"
            (cd "$dir" && zip -r "../../${zipname}" *.apk 2>/dev/null) && ASSETS+=("$zipname")
          done

          echo "Creating release ${TAG} with ${#ASSETS[@]} assets..."

          BODY=$(gh api repos/Openwrt-Passwall/openwrt-passwall2/releases/latest --jq '.body // "No release notes"')

          cat > /tmp/release-notes.md <<NOTES
          ## PassWall2 ${TAG}

          Automatically synced from [upstream](https://github.com/Openwrt-Passwall/openwrt-passwall2/releases/tag/${TAG})

          All packages are signed with the repository key.

          ### APK Repository

          Add to your router:
          \`\`\`
          grep -q 'rage-ac.github.io/Passwall2' /etc/apk/repositories || echo "https://rage-ac.github.io/Passwall2/packages" >> /etc/apk/repositories
          apk update
          apk add luci-app-passwall2
          \`\`\`

          ### Upstream Release Notes
          ${BODY}

          ---
          *Auto-updated by GitHub Actions*
          NOTES

          # If a release with this tag already exists (defective build, manual rerun, etc.),
          # delete it first — gh release create cannot overwrite.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; deleting before recreating"
            gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}"
          fi

          gh release create "$TAG" \
            --title "PassWall2 ${TAG}" \
            --notes-file /tmp/release-notes.md \
            "${ASSETS[@]}"

          echo "Release created: ${TAG}"

      - name: Verify published repository
        if: steps.check.outputs.update == 'true'
        run: |
          # Smoke test the live site the way apk sees it. Runs last so a slow CDN cannot hold up
          # the release; the daily verify-published workflow re-checks it independently.
          sleep 20
          bash ./scripts/verify-repo.sh \
            --url "https://rage-ac.github.io/Passwall2/packages" \
            --expect "@expected-arches.txt" --min-arch 10

          # And the real thing: a genuine apk-tools v3 client set up the way the README tells
          # users to, so index format, signature trust and package visibility are all exercised.
          ARCH=$(head -1 fresh-arches.txt)
          bash ./scripts/apk-smoke-test.sh \
            --url "https://rage-ac.github.io/Passwall2/packages" --arch "$ARCH"
